apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.watermelon"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets { main { java.srcDirs = ['src/main/java', 'src/main/java/TVseriesFragment'] } }

    buildFeatures {
        compose true
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.15"
    }
    namespace 'com.watermelon'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation platform("androidx.compose:compose-bom:2024.11.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation 'androidx.compose.foundation:foundation-layout-android'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation "io.coil-kt:coil-compose:2.5.0"
    implementation 'androidx.compose.ui:ui-tooling-preview-android:1.7.5'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.5'// Or the latest version

    def nav_version = "2.8.4"
    def room_version = "2.2.1"

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.google.code.gson:gson:2.8.6'
    implementation "androidx.navigation:navigation-fragment:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"

    implementation 'com.squareup.picasso:picasso:2.71828'

    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    implementation "com.squareup.retrofit2:retrofit:2.8.1"
    implementation "com.squareup.retrofit2:converter-gson:2.8.1"

    implementation "io.reactivex.rxjava3:rxjava:3.1.9"

//    implementation 'androidx.compose.ui:ui-tooling-preview'

//    // Optional - Integration with activities
//    implementation 'androidx.activity:activity-compose:1.9.3'
//    // Optional - Integration with ViewModels
////    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
//    // Optional - Integration with LiveData
////    implementation 'androidx.compose.runtime:runtime-livedata'


}
